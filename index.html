<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Agendamento Confirmado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    // ATENÇÃO: Verifique se o ID abaixo é o seu!
    fbq('init', '856592480542795'); 
  </script>

  <script>
    (function () {
      var EVENT_NAME = 'AgendamentoConcluido';
      var key = 'agendamento_confirmado_check';
      
      var alreadyDone = sessionStorage.getItem(key) || localStorage.getItem(key);
      if (alreadyDone) return;

      if (typeof fbq === 'function') {
        fbq('trackCustom', EVENT_NAME);
        sessionStorage.setItem(key, '1');
        localStorage.setItem(key, '1');
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }
    .check-icon { font-size: 60px; color: #2ecc71; margin-bottom: 20px; }
    h1 { color: #2ecc71; font-size: 28px; margin-bottom: 15px; }
    p { color: #555; line-height: 1.6; font-size: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-icon">✅</div>
    <h1>Parabéns!</h1>
    <p>Seu agendamento foi confirmado com sucesso. Em breve entraremos em contato!</p>
  </div>
</body>
</html>
